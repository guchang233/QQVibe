[package]
name = "ntqq-reader"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Read-only local HTTP bridge over NTQQ's SQLCipher databases, backed by ntdb_unwrap."
publish = false

[[bin]]
name = "ntqq-reader"
path = "src/main.rs"

[dependencies]
ntdb_unwrap = "0.3"
rusqlite = { version = "0.38", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
